services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:5000}
        NEXT_PUBLIC_JWT_EXPIRATION: ${NEXT_PUBLIC_JWT_EXPIRATION:-7d}
    container_name: helpdesk_ia_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
